name: CI

on:
  pull_request:
    branches: [dev, staging, prod]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"

      - name: Build
        run: ./mvnw -B compile

      - name: Test
        run: ./mvnw -B test
